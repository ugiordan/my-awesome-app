# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit Central Configuration - Org-wide Security & Code Quality
# Synced to all repos via security-config. Do not edit in target repos.

language: "en-US"
early_access: true
inheritance: true

tone_instructions: "Review from line-level code quality to architectural design. Security-first. Be direct. Cite CWE/CVE IDs for security findings. Only flag actionable issues; no praise, no summaries."

reviews:
  profile: chill

  # Don't automatically request changes on PRs (just leave comments)
  request_changes_workflow: false

  # Detect and label low-quality or AI-generated spam PRs (GitHub public repos only)
  slop_detection:
    enabled: true
    label: "ai-slop"

  # Pre-merge checks to enforce before merging PRs
  # mode options: off, warning, error
  # Set to "warning" during rollout, switch to "error" to block merges
  pre_merge_checks:
    description:
      # Validate that PR has a proper description
      mode: warning
    docstrings:
      # Disable docstring coverage checks
      mode: off
    custom_checks:
      - name: "Contribution Quality and Spam Detection"
        mode: warning
        instructions: |
          Evaluate whether this PR shows signs of being a low-quality, AI-generated,
          or spam contribution. This check exists because open-source projects are
          increasingly targeted by automated accounts that spray superficial "security
          fixes" across many repos to farm contribution stats or build credibility for
          future social engineering.

          Flag as FAILING only if AT LEAST TWO signals from DIFFERENT categories
          are present, with concrete evidence for each signal in this PR.

          TEMPLATED CONTENT SIGNALS:
          - PR description follows a rigid, formulaic template (e.g. "Summary / Problem /
            Solution / Changes" or "Severity: Medium | File: path:line") that looks
            copy-pasted rather than written with knowledge of this specific codebase
          - Generic batch-style titles like "fix(security): N improvements across N files"
          - Severity ratings or CWE/CVE IDs in the description that are generic or don't
            accurately match the actual code change
          - Commit messages or branch names that look auto-generated from an issue scanner
            (e.g. "fix/security/path-traversal-in-component-name-can-lea")
          - PR body reads like an AI-generated vulnerability report rather than a developer
            explaining their change

          SECURITY THEATER SIGNALS:
          - The fix addresses a theoretical vulnerability in code that never processes
            untrusted input: dev tools, code generators, test utilities, build scripts,
            local CLI tools, or scaffolding commands used only by developers
          - Input validation is added but is redundant because upstream validation already
            constrains the input (e.g. a regex restricts to alphanumeric characters, then
            a separate path traversal check is added that can mathematically never trigger)
          - Lexical-only path validation (filepath.Clean/Rel, os.path.normpath) without
            symlink resolution, presented as a complete path traversal fix
          - The fix partially addresses one attack vector while leaving the actual attack
            surface (e.g. the real user-controlled input) completely untouched
          - Security fix with zero test coverage, no proof of exploitability, no linked
            issue, no CVE, and no threat model explanation

          CONTRIBUTION PATTERN SIGNALS:
          - First-time contributor with no prior issues, comments, or discussion in this
            repository or organization
          - PR modifies only a single file with a small, self-contained, additive-only
            change that requires no understanding of the broader codebase architecture
          - No linked issue, no Jira ticket, no prior discussion thread, no referenced
            security advisory
          - The change looks like it was generated by scanning the code with an automated
            tool and applying a generic fix template without understanding context

          CODE QUALITY SIGNALS:
          - Regex compiled on every function call instead of using a package-level
            compiled pattern (regexp.MustCompile)
          - Unreachable error handling: checking errors from functions that cannot fail
            given the inputs (e.g. regexp.MatchString with a valid static pattern)
          - Dead code paths that look defensive but can never execute given other
            constraints already present in the same function
          - Validation logic that duplicates what the language or framework already
            guarantees (e.g. adding nil checks after a guaranteed non-nil return)
          - No tests added for any of the new validation logic

          CROSS-REPO SPRAY SIGNALS:
          - Treat this category as present only when you include verifiable evidence
            (links) of similar PRs by the same author across unrelated repositories.
          - If verifiable cross-repo evidence is unavailable, do NOT count this category.
          - The PR description and structure should be materially identical to linked PRs,
            not just similar in tone.

          IMPORTANT CAVEATS (read before flagging):
          - A single signal alone is NOT sufficient to fail this check.
          - Two signals from the SAME category are NOT sufficient to fail this check.
          - Require at least two signals from DIFFERENT categories.
          - At least one signal MUST come from SECURITY THEATER SIGNALS or
            CODE QUALITY SIGNALS.
          - If the fix addresses a real vulnerability with a realistic exploit scenario
            and includes tests or a clear threat model, do NOT flag it regardless of
            other signals.
          - Experienced contributors sometimes submit small focused fixes. That is normal.
          - When in doubt, PASS this check and note your concerns in review comments
            instead. False positives on legitimate contributors are worse than letting
            a low-quality PR through for human review.

  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  changed_files_summary: false
  suggested_labels: false
  suggested_reviewers: false
  related_issues: false
  related_prs: false
  poem: false

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  commit_status: true
  fail_commit_status: false

  tools:
    gitleaks:
      enabled: true

    truffleHog:
      enabled: true

    semgrep:
      enabled: true
      config_file: "semgrep.yaml"

    opengrep:
      enabled: true

    checkov:
      enabled: true

    osvScanner:
      enabled: true

    trivy:
      enabled: true

    eslint:
      enabled: true

    ruff:
      enabled: true

    cppcheck:
      enabled: true

    golangci-lint:
      enabled: true

    sqlfluff:
      enabled: true

    shellcheck:
      enabled: true

    hadolint:
      enabled: true

    yamllint:
      enabled: true

    actionlint:
      enabled: true

    markdownlint:
      enabled: true

  path_instructions:
    - path: "**"
      instructions: |
        REVIEW PRIORITIES:
        1. Security vulnerabilities (provide severity, exploit scenario, and remediation code)
        2. Architectural issues and anti-patterns
        3. Bug-prone patterns and error handling gaps
        4. Performance problems

    - path: "**/*.py"
      instructions: |
        PYTHON SECURITY:
        1. No eval() or exec() with untrusted input (CWE-94)
        2. Use parameterized queries for databases (prevent SQL injection)
        3. Validate file paths (prevent path traversal)
        4. No shell=True in subprocess

    - path: "**/Dockerfile*"
      instructions: |
        DOCKERFILE SECURITY (CWE-798, CWE-250):
        1. No secrets in build args or ENV
        2. Use specific image tags (not :latest)
        3. Run as non-root user
        4. Use multi-stage builds

  path_filters:
    - "!.git/**"
    - "!vendor/**"
    - "!node_modules/**"
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!semgrep.yaml"
    - "!.coderabbit.yaml"

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    base_branches:
      - main

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
