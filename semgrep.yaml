rules:
  - id: python-hardcoded-password
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|pwd|secret|token|api_key|apikey)
    message: "Hardcoded credential detected in variable '$VAR'"
    languages: [python]
    severity: ERROR

  - id: python-pickle-unsafe-load
    pattern: pickle.load(...)
    message: "Unsafe pickle deserialization detected"
    languages: [python]
    severity: ERROR
